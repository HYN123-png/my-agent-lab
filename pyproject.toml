[project]
name = "my-agent-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "chromadb>=1.5.0",
    "huggingface-hub[cli]>=2.4.0",
    "jieba>=0.42.1",
    "langgraph>=1.2.19",
    "modelscope>=1.40.2",
    "openai>=3.42.0",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=3.0.0",
    "sentencepiece>=0.2.2",
    "streamlit>=1.66.1",
    "transformers>=4.30.0",
]

[project.scripts]
my-agent-lab = "my_agent_lab:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
